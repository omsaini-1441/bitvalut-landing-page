<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-b.jpg</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gurajada:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7f7}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1280px">
  <div class="r-nav-rule region chrome" data-region="nav-rule"><!-- thin navigation strip and bottom rule on white security stock --></div>
  <div class="r-wordmark region text" data-region="wordmark"><!-- BITVAULT wordmark with small geometric seal --><p style="font-size:var(--r-wordmark-font);line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-nav-links region text" data-region="nav-links"><!-- How it protects and Recovery navigation links --><p style="font-size:var(--r-nav-links-font);line-height:1.05;margin:0">nav-links</p></div>
  <div class="r-sign-in region control" data-region="sign-in"><!-- Sign in control with shield mark: rebuild the control's chrome from the crop (comp-spec.mjs --crop sign-in); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-headline region text" data-region="headline"><!-- large two-line headline Passwords with nowhere to leak --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-hero-deck region text" data-region="hero-deck"><!-- two-line Android phone and no internet permission explanation --><p style="font-size:var(--r-hero-deck-font);line-height:1.05;margin:0">hero-deck</p></div>
  <div class="r-primary-cta region control" data-region="primary-cta"><!-- cobalt Get BitVault free button: rebuild the control's chrome from the crop (comp-spec.mjs --crop primary-cta); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-secondary-cta region control" data-region="secondary-cta"><!-- underlined See how it works link: rebuild the control's chrome from the crop (comp-spec.mjs --crop secondary-cta); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-certificate-shell region chrome" data-region="certificate-shell"><!-- white access-pass shell with fine navy rule and perforated divider --></div>
  <figure class="r-seal-plate region plate" data-region="seal-plate"><img src="../../../assets/plates/seal-plate.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-claim-label region text" data-region="claim-label"><!-- CLAIM FREE ACCESS label with short vermilion rule --><p style="font-size:var(--r-claim-label-font);line-height:1.05;margin:0">claim-label</p></div>
  <div class="r-auth-options region text" data-region="auth-options"><!-- Continue with Google and or with email choices --><p style="font-size:var(--r-auth-options-font);line-height:1.05;margin:0">auth-options</p></div>
  <div class="r-stub-cta region control" data-region="stub-cta"><!-- vermilion GET BITVAULT FREE action: rebuild the control's chrome from the crop (comp-spec.mjs --crop stub-cta); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-serial-block region text" data-region="serial-block"><!-- serial BV-000001 and barcode block --><p style="line-height:1.05;margin:0">serial-block</p></div>
  <div class="r-proof-band region chrome" data-region="proof-band"><!-- deep navy transition band --></div>
  <div class="r-proof-title region text" data-region="proof-title"><!-- large white statement Your vault is not an account --><p style="font-size:var(--r-proof-title-font);line-height:1.05;margin:0">proof-title</p></div>
  <div class="r-proof-copy region text" data-region="proof-copy"><!-- local Android vault and optional web recovery account explanation --><p style="font-size:var(--r-proof-copy-font);line-height:1.05;margin:0">proof-copy</p></div>
  <figure class="r-proof-guilloche region plate" data-region="proof-guilloche"><img src="../../../assets/plates/proof-guilloche.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
</main>
</body>
</html>
